version: 2
updates:
  # requirements.txt lives at the repo root.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  # Keep the CI workflow's own action versions (actions/checkout,
  # actions/setup-python, etc.) current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
