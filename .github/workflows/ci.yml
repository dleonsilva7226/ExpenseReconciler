name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-sanity-check:
    name: Lint & import sanity check
    runs-on: ubuntu-latest

    # Dummy values for every required field on app.config.Settings,
    # consumed by the live import check below (D4/gateway has now
    # merged into main, so the full app module graph — including
    # app.gateway.router — exists and `import app.main` runs for
    # real). No test suite exists yet (D7 is a separate, not-yet-started
    # ticket) — see the devops status note at
    # docs/agent-artifacts/devops/2026-09-20-ci-dependabot.md for why this
    # workflow leans on lint + import-check instead of pytest for now.
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/jarvis_ci
      PLAID_CLIENT_ID: dummy-plaid-client-id
      PLAID_SECRET: dummy-plaid-secret
      TELEGRAM_BOT_TOKEN: dummy-telegram-bot-token
      TELEGRAM_ALLOWED_CHAT_ID: "123456789"
      TELEGRAM_WEBHOOK_SECRET_TOKEN: dummy-telegram-webhook-secret
      ADMIN_USERNAME: dummy-admin
      ADMIN_PASSWORD: dummy-admin-password
      TOKEN_ENCRYPTION_KEY: dummy-token-encryption-key
      JOBS_TRIGGER_SECRET: dummy-jobs-trigger-secret
      OPENAI_API_KEY: dummy-openai-api-key
      GEMINI_API_KEY: dummy-gemini-api-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt not found; skipping project dependency install."
          fi

      - name: Lint (ruff)
        run: ruff check .

      - name: Live import sanity check
        run: |
          # D4/gateway merged into main (see the devops status note at
          # docs/agent-artifacts/devops/2026-09-26-restore-live-import-check.md),
          # so the full app module graph now exists (app.gateway.router
          # included). This restores the live `import app.main` check
          # that was temporarily downgraded to a syntax-only
          # compileall pass while D4 was still in flight — a real
          # import now exercises module-level wiring (config loading,
          # client/engine construction, router registration), not just
          # parseable syntax.
          if [ -d app ]; then
            python -c "import app.main"
          else
            echo "app/ not found; skipping import sanity check."
          fi
